# https://taskfile.dev

version: '3'

dotenv: ['.env', '{{.ENV}}/.env', '{{.HOME}}/.env']

vars:
  PACKAGE_NAME:
    sh: grep -m 1 "^module" go.mod | awk '{print $2}'
  COMMIT_HASH:
    sh: '[ -n "$SOURCE_COMMIT" ] && echo "$SOURCE_COMMIT" || git rev-parse HEAD || echo "unknown"'
  BUILD_TIME:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  BUILD_PATH: build

env:
  PACKAGE_NAME: '{{.PACKAGE_NAME}}'
  CGO_ENABLED: 0

tasks:
  cleanup:
    desc: Cleanup build artifacts
    cmds:
      - rm -rf {{.BUILD_PATH}}/

  build:
    desc: Build the example servers
    deps: [ deps, cleanup ]
    dir: examples
    cmds:
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/vanilla ./vanilla
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/minimal ./minimal
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/flat ./flat
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/custom ./custom
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/observed ./observed
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/custom-command ./custom-command
        platforms: [linux/amd64,linux/arm64]

  deps:
    desc: Download Go dependencies
    # Download only. This task used to run `go env -w GOSUMDB=off` — which
    # writes to the user's Go environment file and silently opts every later
    # `go get`, in every repository on the machine, out of sum.golang.org —
    # plus `go mod tidy`, which let any task rewrite the module graph, and
    # `go mod vendor` into a directory that is gitignored and untracked, so
    # `-mod vendor` passed on a prepared machine and failed in every fresh
    # clone. Tidying moved to its own task, vendoring is gone (the other five
    # repositories resolve from the module cache, and so does CI), and the Go
    # environment is nobody's to write.
    sources:
      - go.mod
      - go.sum
    cmds:
      - go mod download

  tidy:
    desc: Normalize go.mod and go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format go code
    deps: [ deps ]
    cmds:
      - gci write -s standard -s default -s "prefix(github.com/openserbia)" -s "prefix({{.PACKAGE_NAME}})" --skip-generated internal server config pkg examples apicompat
      - gofumpt -l -w .

  fmt:check:
    desc: Check Go formatting without changing files
    # lint depends on this rather than on fmt, because a lint that rewrites
    # the tree is a lint whose findings a reviewer never sees and a clean-tree
    # release check would fail.
    deps: [ deps ]
    cmds:
      - |
        formatting_diff="$(golangci-lint fmt --diff)"
        if [ -n "$formatting_diff" ]; then
          printf '%s\n' "$formatting_diff"
          exit 1
        fi

  lint:
    desc: Run go linters
    deps: [ fmt:check ]
    cmds:
      - golangci-lint run

  secrets:
    desc: Scan the repository tree for secrets and private keys
    cmds:
      - gitleaks dir --no-banner --redact --verbose .

  secrets:staged:
    desc: Scan staged changes for secrets and private keys
    cmds:
      - gitleaks git --no-banner --redact --verbose --staged

  precommit:
    desc: Run checks required before a commit
    cmds:
      - task: lint
      - task: secrets:staged

  vuln:
    desc: Check dependencies for known vulnerabilities
    deps: [ deps ]
    cmds:
      - govulncheck ./...

  interop:deps:
    desc: Install the pinned Node dependencies the interop lane runs against
    # Its own task so Task can skip it. npm ci deletes and reinstalls
    # node_modules by design, which is what makes it reproducible and what makes
    # it worth doing only when the lockfile moves.
    sources:
      - interop/node/package.json
      - interop/node/package-lock.json
    generates:
      - interop/node/node_modules/.package-lock.json
    cmds:
      - npm ci --prefix interop/node

  test:interop:
    desc: Run the loopback interoperability lane against the pinned Node client
    deps: [ deps, interop:deps ]
    cmds:
      - go test -count=1 ./interop

  test:profile:
    desc: Run the observability off-profile benchmark and its exit-criterion test
    deps: [ deps ]
    cmds:
      - go test -run TestOffProfile -bench BenchmarkObserve -benchtime 3x ./server/

  test:examples:
    desc: Build and start each example in the nested examples module
    deps: [ deps ]
    dir: examples
    cmds:
      - go mod tidy
      - go test -count=1 ./...

  test:
    desc: Run go unit tests
    deps: [ deps ]
    cmds:
      - go test -covermode=count -coverprofile=coverage.out -coverpkg ./... ./...
      # The examples are a nested module, so `go test ./...` from the root
      # cannot see them. Running them here is what stops them rotting.
      - task: test:examples

  test:race:
    desc: Run go unit tests with the race detector
    deps: [ deps ]
    # The race detector is built on cgo, so it cannot run under the global
    # CGO_ENABLED=0; override it for this task only.
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage-race.out -coverpkg ./... ./...

  api:check:
    desc: Compare the public surface against the committed baseline
    # The baseline under api/ is per-package export data compared through
    # apidiff. The tooling lives in the nested apicompat module so a module
    # embedding this server does not inherit apidiff and its loader, which is
    # the same reason the examples module owns the Prometheus client.
    #
    # -count=1 is load-bearing. This test reads the parent module's source at
    # run time, and Go's test cache hashes only the files of the module under
    # test — so a cached pass would survive any change to the surface it is
    # meant to be watching, which is every change it exists for.
    cmds:
      - cd apicompat && go test -count=1 ./apicheck

  api:accept:
    desc: Rewrite the public surface baseline, deliberately
    # Run this in the same commit as the change it accepts, so a reviewer sees
    # the new surface and the reason for it at once.
    cmds:
      - cd apicompat && go run ./cmd/apibaseline -module .. -out ../api

  verify:
    desc: Run all local and CI checks
    cmds:
      - task: lint
      - task: secrets
      - task: api:check
      - task: test:race
      - task: test:examples
      - task: test:profile
      - task: test:interop
      - task: vuln
      - task: build

  release:check:
    desc: Verify a clean release candidate
    requires:
      vars: [VERSION]
    cmds:
      - task: verify
      - cmd: test -z "$(git status --porcelain)"
        platforms: [linux, darwin]
      # This repository requires both minecraft-protocol and
      # minecraft-simulation, so it is where a release-order mistake — a
      # replace directive left pointing at a sibling checkout — would land.
      - cmd: '! grep -Eq ''^replace[[:space:]]'' go.mod'
        platforms: [linux, darwin]
      - cmd: printf '%s\n' '{{.VERSION}}' | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
        platforms: [linux, darwin]

  server:
    desc: Run the vanilla example server
    deps: [ deps ]
    dir: examples
    cmds:
      - go run ./vanilla {{.CLI_ARGS}}

  default:
    cmds:
      - task -l