# https://taskfile.dev

version: '3'

dotenv: ['.env', '{{.ENV}}/.env', '{{.HOME}}/.env']

vars:
  PACKAGE_NAME:
    sh: grep -m 1 "^module" go.mod | awk '{print $2}'
  COMMIT_HASH:
    sh: '[ -n "$SOURCE_COMMIT" ] && echo "$SOURCE_COMMIT" || git rev-parse HEAD || echo "unknown"'
  BUILD_TIME:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  BUILD_PATH: build

env:
  PACKAGE_NAME: '{{.PACKAGE_NAME}}'
  CGO_ENABLED: 0

tasks:
  cleanup:
    desc: Cleanup build artifacts
    cmds:
      - rm -rf {{.BUILD_PATH}}/

  build:
    desc: Build the example servers
    deps: [ deps, cleanup ]
    dir: examples
    cmds:
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/vanilla ./vanilla
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/minimal ./minimal
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/flat ./flat
        platforms: [linux/amd64,linux/arm64]
      - cmd: go build -ldflags="-w -s" -trimpath -o ../{{.BUILD_PATH}}/custom ./custom
        platforms: [linux/amd64,linux/arm64]

  deps:
    desc: Install go vendor dependencies
    sources:
      - go.mod
      - go.sum
    cmds:
      - go env -w GOPROXY=https://proxy.golang.org,direct
      - go env -w GOSUMDB=off
      - go mod download
      - go mod tidy
      - go mod vendor
    generates:
      - vendor/modules.txt
    method: timestamp

  fmt:
    desc: Format go code
    deps: [ deps ]
    cmds:
      - gci write -s standard -s default -s "prefix(github.com/openserbia)" -s "prefix({{.PACKAGE_NAME}})" --skip-generated internal server config pkg examples
      - gofumpt -l -w .

  lint:
    desc: Run go linters
    deps: [ fmt ]
    cmds:
      - golangci-lint run

  interop:deps:
    desc: Install the pinned Node dependencies the interop lane runs against
    # Its own task so Task can skip it. npm ci deletes and reinstalls
    # node_modules by design, which is what makes it reproducible and what makes
    # it worth doing only when the lockfile moves.
    sources:
      - interop/node/package.json
      - interop/node/package-lock.json
    generates:
      - interop/node/node_modules/.package-lock.json
    cmds:
      - npm ci --prefix interop/node

  test:interop:
    desc: Run the loopback interoperability lane against the pinned Node client
    deps: [ deps, interop:deps ]
    cmds:
      - go test -mod vendor -count=1 ./interop

  test:profile:
    desc: Run the observability off-profile benchmark and its exit-criterion test
    deps: [ deps ]
    cmds:
      - go test -mod vendor -run TestOffProfile -bench BenchmarkObserve -benchtime 3x ./server/

  test:examples:
    desc: Build and start each example in the nested examples module
    deps: [ deps ]
    dir: examples
    cmds:
      - go mod tidy
      - go test -count=1 ./...

  test:
    desc: Run go unit tests
    deps: [ deps ]
    cmds:
      - go test -mod vendor -covermode=count -coverprofile=../service-unit.cov -coverpkg ./... ./...
      # The examples are a nested module, so `go test ./...` from the root
      # cannot see them. Running them here is what stops them rotting.
      - task: test:examples

  test:race:
    desc: Run go unit tests with the race detector
    deps: [ deps ]
    # The race detector is built on cgo, so it cannot run under the global
    # CGO_ENABLED=0; override it for this task only.
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -race -mod vendor -covermode=atomic -coverprofile=../service-unit-race.cov -coverpkg ./... ./...

  server:
    desc: Run the vanilla example server
    deps: [ deps ]
    dir: examples
    cmds:
      - go run ./vanilla {{.CLI_ARGS}}

  default:
    cmds:
      - task -l